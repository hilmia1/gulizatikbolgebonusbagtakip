  </g>
    <text x="270" y="438" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="84" letter-spacing="26" fill="#ffffff" fill-opacity=".96">EGE</text>
    <line x1="148" y1="470" x2="214" y2="470" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
