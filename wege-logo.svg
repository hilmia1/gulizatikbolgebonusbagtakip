<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fe0c4"/><stop offset=".38" stop-color="#00b7bc"/><stop offset=".72" stop-color="#0a9bb0"/><stop offset="1" stop-color="#1a6fb0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset=".55" stop-color="#d4fbff" stop-opacity=".28"/><stop offset="1" stop-color="#d4fbff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e8fdff"/><stop offset="1" stop-color="#aaeef6"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a4eaf2"/></linearGradient>
    <linearGradient id="champ" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f2feff"/><stop offset="1" stop-color="#c6f1f7"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity=".15"/><stop offset=".5" stop-color="#ddfdff"/><stop offset="1" stop-color="#ffffff" stop-opacity=".15"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".42"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <radialGradient id="bloom" cx=".85" cy=".95" r=".7"><stop offset="0" stop-color="#5fd8f5" stop-opacity=".25"/><stop offset="1" stop-color="#7be8ff" stop-opacity="0"/></radialGradient>
    <clipPath id="rr"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#rr)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#bloom)"/>
    <ellipse cx="190" cy="-40" rx="420" ry="250" fill="url(#sheen)"/>
    <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
    
  <g transform="translate(0.0 0.0) scale(1.0)">
    <g transform="translate(256 212) scale(.8) translate(-256 -300)">
    <!-- sun glow -->
    <circle cx="256" cy="208" r="150" fill="url(#glow)"/>
    <!-- sun rings -->
    <circle cx="256" cy="208" r="86" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".35"/>
    <circle cx="256" cy="208" r="66" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".55"/>
    <circle cx="256" cy="208" r="46" fill="url(#sun)"/>
    <!-- W monogram -->
    <path d="M100 272 L140 360 Q166 416 196 366 L228 312 Q256 266 284 312 L316 366 Q346 416 372 360 L412 272" fill="none" stroke="#00505a" stroke-opacity=".28" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 8)"/>
    <path d="M100 272 L140 360 Q166 416 196 366 L228 312 Q256 266 284 312 L316 366 Q346 416 372 360 L412 272" fill="none" stroke="url(#champ)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 272 L140 360 Q166 416 196 366 L228 312 Q256 266 284 312 L316 366 Q346 416 372 360 L412 272" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(-4 -5)"/>
